name: Release NuGet

on:
  release:
    types: [published]
    
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      id-token: write # GitHub OIDC token for NuGet trusted publishing
    steps:
    
    - name: Set Version Variable
      if: ${{ github.ref_type == 'tag' }}
      env:
        TAG: ${{ github.ref_name }}
      run: echo "VERSION=${TAG#v}" >> $GITHUB_ENV
      
    - name: Checkout
      uses: actions/checkout@v7

    - name: Setup .NET SDK
      uses: actions/setup-dotnet@v6
      with:
        global-json-file: global.json

    - name: Build
      run: dotnet build -c Release /p:Version=$VERSION

    - name: Test
      run: dotnet test -c Release --no-build

    - name: Pack EntityFrameworkCore.Encrypted
      run: dotnet pack src/EntityFrameworkCore.Encrypted -c Release --no-build --output . /p:Version=$VERSION

    - name: Pack EntityFrameworkCore.Encrypted.AwsKms
      run: dotnet pack src/EntityFrameworkCore.Encrypted.AwsKms -c Release --no-build --output . /p:Version=$VERSION

    # trusted publishing: exchanges the OIDC token for a NuGet API key valid for 1 hour
    - name: NuGet login
      uses: NuGet/login@v1
      id: login
      with:
        user: ${{ secrets.NUGET_USER }}

    - name: Push to NuGet packages
      run: dotnet nuget push "*.nupkg" --api-key ${{ steps.login.outputs.NUGET_API_KEY }} --source https://api.nuget.org/v3/index.json --skip-duplicate

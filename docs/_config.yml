gh_edit_view_mode: edit

footer_content: Licensed under <a href="https://github.com/starushykart/ef-core-encryption/blob/main/LICENSE">MIT</a>.

exclude:
  - Gemfile
  - Gemfile.lock
  - vendor

callouts:
  note:
    title: Note
    color: blue
  tip:
    title: Tip
    color: green
  important:
    title: Important
    color: purple
  warning:
    title: Warning
    color: red
